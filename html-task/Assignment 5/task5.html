<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 5 - Pakistan Image Map</title>
  
</head>
<body>
  <h1>Task 5: Pakistan Map</h1>
  <p>Click on any province to open its Wikipedia page.</p>

  <img src="./assests/images/mapimg.jpeg" alt="Map of Pakistan" usemap="#image-map">

  <map name="image-map">
    <area target="" alt="Islamabad" title="Islamabad" href="https://en.wikipedia.org/wiki/Islamabad" coords="500,300,12" shape="circle">
    <area target="" alt="Azad Kashmir" title="Azad Kashmir" href="https://en.wikipedia.org/wiki/Azad_Kashmir" coords="530,240,600,320" shape="rect">
    <area target="" alt="Gilgit-Baltistan" title="Gilgit-Baltistan" href="https://en.wikipedia.org/wiki/Gilgit-Baltistan" coords="470,120,670,240" shape="rect">
    <area target="" alt="Khyber Pakhtunkhwa" title="Khyber Pakhtunkhwa" href="https://en.wikipedia.org/wiki/Khyber_Pakhtunkhwa" coords="360,160,490,300" shape="rect">
    <area target="" alt="Punjab" title="Punjab" href="https://en.wikipedia.org/wiki/Punjab,_Pakistan" coords="380,300,550,470" shape="rect">
    <area target="" alt="Sindh" title="Sindh" href="https://en.wikipedia.org/wiki/Sindh" coords="260,470,420,620" shape="rect">
    <area target="" alt="Balochistan" title="Balochistan" href="https://en.wikipedia.org/wiki/Balochistan,_Pakistan" coords="80,300,380,570" shape="rect">
  </map>

  
</body>
</html>
