<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign Up</title>
</head>
<body style="background-color:#1f1f1f; color:white; text-align:center;">

    <main>

        <section class="form-container">

            <form action="signup3.html" method="post">

                <fieldset style="border:1px solid white; text-align:center;">

                <legend>Sign Up - Contact Information</legend>

                <input type="tel" name="phone" placeholder="Phone number" required>
                <br><br>

                <select name="country" required>
                    <option value="">Country</option>
                    <option>Pakistan</option>
                    <option>Canada</option>
                    <option>United Kingdom</option>
                    <option>United States</option>
                    <option>Other</option>
                </select>
                <br><br>

                <input type="text" name="address" placeholder="Address" required>
                <br><br>

                <select name="contact" required>
                    <option value="">Preferred Contact Method</option>
                    <option>Phone</option>
                    <option>Email</option>
                    <option>WhatsApp</option>
                </select>
                <br><br>

                <input type="checkbox" name="terms" required>
                <label for="terms">Agreement to Terms</label>
                <br><br>

                <button type="submit">Next</button>

                </fieldset>

            </form>

        </section>

    </main>

</body>
</html>
