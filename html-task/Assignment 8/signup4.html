<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign Up</title>
</head>
<body style="background-color:#1f1f1f; color:white; text-align:center;">

    <main>

        <section class="form-container">

            <form action="index.html" method="post">

                <fieldset style="border:1px solid white; text-align:center;">

                <legend>Sign Up - Preferences</legend>

                <input type="checkbox" name="Notifications" value="on">
                <label for="Notifications">Receive Notifications</label>
                <br><br>

                <select name="PrefJobLoca" required>
                    <option value="">Preferred Job Location</option>
                    <option value="Hyd">Hyderabad</option>
                    <option value="Khi">Karachi</option>
                    <option value="Lhr">Lahore</option>
                    <option value="Isb">Islamabad</option>
                    <option value="Remote">Remote</option>
                </select>
                <br><br>

                <button type="submit">Submit</button>
                <p><a href="index.html" style="color:red;">Forgot Password?</a></p>

                </fieldset>

            </form>

        </section>

    </main>

</body>
</html>
