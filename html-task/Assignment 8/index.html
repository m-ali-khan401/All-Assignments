<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
</head>
<body style="background-color:#1f1f1f; color:white; text-align:center;">

    <main>

        <section class="form-container">

            <form action="signup1.html" method="post">
                
                <fieldset style="border:1px solid white; text-align:center;">
                <legend>Login</legend>

                <input type="email" name="email" placeholder="Email" required>
                <br><br>

                <input type="password" name="password" placeholder="Password" required>
                <br><br>

                <button type="submit">Login</button>

                <p>Dont have an account? <a href="signup1.html" style="color:red;">Sign up</a></p>

                </fieldset>

            </form>

        </section>
        
    </main>

</body>
</html>
