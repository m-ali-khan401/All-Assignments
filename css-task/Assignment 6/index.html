<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinators</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box descombinator">
        <h3>Descendant ( space )</h3>
        <p>para 1</p>
        <div>
            <p>para 2</p>
        </div>
    </div>

    <div class="box childcombinator">
        <h3>Child ( > )</h3>
        <p>direct</p>
        <div>
            <p>nested</p>
        </div>
    </div>

    <div class="box adjacentcombinator">
        <h3>Adjacent ( + )</h3>
        <p>before</p>
        <h2>heading</h2>
        <p>after 1</p>
        <p>after 2</p>
    </div>

    <div class="box generalcombinator">
        <h3>General ( ~ )</h3>
        <p>before</p>
        <h2>heading</h2>
        <p>after 1</p>
        <span>span</span>
        <p>after 2</p>
    </div>

</body>
</html>
